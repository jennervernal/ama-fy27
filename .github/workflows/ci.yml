name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - jennervernal-add-assignment

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run evaluation tests
        run: python -m unittest discover -s eval -p 'test_*.py' -v
      - name: Verify generated datasets
        run: |
          python eval/generate_datasets.py
          git diff --exit-code -- eval/dataset/benchmark-draft.jsonl eval/dataset/pii-stress-draft.jsonl
